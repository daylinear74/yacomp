name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Opt every javascript-based action in this workflow into the Node.js 24
# runtime. GitHub deprecated the Node 20 runner; setting this here keeps the
# pipeline working with action versions that haven't shipped a Node 24
# release yet (e.g. softprops/action-gh-release). Drop once every action
# we use bundles Node 24 by default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify output
        run: bun run verify

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/yacomp.user.js
          generate_release_notes: true
          # Tags with a hyphen are semver prereleases (e.g. v5.8.14-dev.1,
          # v5.9.0-rc.1). Mark them as prerelease and keep /releases/latest/
          # pinned to the newest non-hyphen tag so users on the stable
          # update URL don't pick up dev builds.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
