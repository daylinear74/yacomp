<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{TORRENT_TITLE}} :: HDBits</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
</head>
<body>
  <!--
    Sanitized HDBits offer-detail chrome (/offers/details?id=…).

    Mirrors the torrent template's traversal surface with the offer page's two
    structural differences: the details table has NO id="details", and the
    description <td> carries a leading <div class="label">Description</div>
    inside the same cell instead of a separate label row. Placeholders:

      {{TORRENT_TITLE}}   — fills the H1 (used by namesFromHeadings fallback)
      {{DESCRIPTION}}     — case content for slot: offer.description
      {{COMMENTS}}        — case content (wrapped in a comment row) for
                            slot: offer.comment
  -->

  <table id="header" class="main" style="margin-bottom: 5px">
    <tbody>
      <tr>
        <td class="embedded"><a href="/"><div id="logo"></div></a></td>
      </tr>
    </tbody>
  </table>

  <table align="center" class="menu" width="100%" cellspacing="0" cellpadding="0">
    <tbody>
      <tr>
        <td align="center" class="menunavigation"><a class="normal" href="/browse.php">Browse</a></td>
        <td align="center" class="menunavigation"><a class="normal" href="/offers">Offers</a></td>
        <td align="center" class="menunavigation"><a class="normal" href="/forums">Forums</a></td>
      </tr>
    </tbody>
  </table>

  <table width="100%" class="main">
    <tbody>
      <tr>
        <td class="bottom" align="center" valign="top">

          <table width="500" cellspacing="0" cellpadding="10" border="1" align="center">
            <tbody>
              <tr>
                <td align="center" class="submenu-highlight"><a href="/offers">Browse offers</a></td>
                <td align="center"><b><a href="/offers/add">Add offer</a></b></td>
              </tr>
            </tbody>
          </table>

          <div class="torrent-title center">
            <h1 style="display:inline-block;" class="internal">{{TORRENT_TITLE}}</h1>
          </div>

          <table width="930" border="1" cellspacing="0" cellpadding="5">
            <tbody>
              <tr><td><div id="l100000001" class="label collapsable"><span class="plusminus">+ </span>About this title</div><div id="c100000001" class="hideablecontent" style="display:none">Plot summary placeholder.</div></td></tr>
              <tr>
                <td>
                  <div id="l100000002" class="label">Description</div>{{DESCRIPTION}}
                </td>
              </tr>
              <tr><td><div class="label">Offer status</div></td></tr>
            </tbody>
          </table>

          <p><a name="startcomments"></a></p>
          <p align="center"><a class="index" href="#">Add a comment</a></p>
          <table class="main" border="0" cellspacing="0" cellpadding="0">
            <tbody>
              <tr>
                <td class="embedded">
                  <table width="100%" border="1" cellspacing="0" cellpadding="10">
                    <tbody>
                      {{COMMENTS}}
                    </tbody>
                  </table>
                </td>
              </tr>
            </tbody>
          </table>

        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
